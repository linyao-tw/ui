name: 持續整合

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyds-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 驗證工作區
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取得程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 設定 pnpm 與 Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          install: false

      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile

      - name: 安裝 Storybook 測試用 Chromium
        run: pnpm --filter @lyds/storybook exec playwright install --with-deps chromium

      - name: 檢查格式
        run: pnpm format:check

      - name: 執行程式碼檢查
        run: pnpm lint

      - name: 檢查型別
        run: pnpm typecheck

      - name: 測試發佈規則
        run: pnpm test:release

      - name: 測試元件
        run: pnpm test

      - name: 建置套件與 Storybook
        run: pnpm build

      - name: 驗證 npm 套件內容
        run: pnpm pack:check

      - name: 上傳 GitHub Pages 用 Storybook
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/storybook/storybook-static
          retention-days: 1

  deploy_storybook:
    name: 部署 Storybook 至 GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: lyds-storybook-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 部署 Storybook 至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
