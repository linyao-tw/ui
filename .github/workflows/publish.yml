name: Publish npm package

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions: {}

concurrency:
  group: lyds-npm-publish
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate and package ${{ github.ref_name }}
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
      integrity: ${{ steps.artifact.outputs.integrity }}
      artifact_name: ${{ steps.artifact_name.outputs.name }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is reachable from main
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main || {
            echo "The full checkout did not fetch origin/main." >&2
            exit 1
          }
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" refs/remotes/origin/main || {
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit reachable from main." >&2
            exit 1
          }

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.24.0
          runtime: node@24
          cache: false
          install: false

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Storybook tests
        run: pnpm --filter @lyds/storybook exec playwright install --with-deps chromium

      - name: Derive and validate release plan
        id: plan
        run: node scripts/release/release.mjs plan --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT"

      - name: Test release policy
        run: pnpm test:release

      - name: Run complete quality suite
        run: pnpm check

      - name: Verify checkout remains clean
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            echo "Quality checks changed the clean release checkout." >&2
            exit 1
          fi

      - name: Set CI-only package version
        run: node scripts/release/release.mjs set-version --file packages/ui/package.json --version "${{ steps.plan.outputs.version }}"

      - name: Build versioned package
        run: pnpm build:package

      - name: Pack release artifact once
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          pack_directory="${RUNNER_TEMP}/lyds-pack"
          mkdir -p "$pack_directory"
          pnpm --filter @lyds/ui pack --pack-destination "$pack_directory"
          shopt -s nullglob
          tarballs=("$pack_directory"/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one release tarball, found ${#tarballs[@]}." >&2
            exit 1
          fi
          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate exact release tarball contents and consumption
        run: node scripts/verify-package.mjs --tarball "${{ steps.pack.outputs.tarball }}"

      - name: Verify final artifact identity and integrity
        id: artifact
        run: >-
          node scripts/release/release.mjs publish --kind "${{ steps.plan.outputs.kind }}" --version "${{ steps.plan.outputs.version }}" --dist-tag "${{ steps.plan.outputs.dist_tag }}" --tarball "${{ steps.pack.outputs.tarball }}" --dry-run --output "$GITHUB_OUTPUT"

      - name: Record rerun-stable artifact name
        id: artifact_name
        run: echo "name=lyds-ui-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish ${{ needs.preflight.outputs.version }}
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    needs: preflight
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up npm runtime without installing project dependencies
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.24.0
          runtime: node@24
          cache: false
          install: false

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: ${{ runner.temp }}/lyds-release

      - name: Locate unique release tarball
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("${RUNNER_TEMP}/lyds-release"/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one downloaded release tarball, found ${#tarballs[@]}." >&2
            exit 1
          fi
          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Reverify artifact and publish through npm trusted publishing
        id: npm
        run: >-
          node scripts/release/release.mjs publish --kind "${{ needs.preflight.outputs.kind }}" --version "${{ needs.preflight.outputs.version }}" --dist-tag "${{ needs.preflight.outputs.dist_tag }}" --tarball "${{ steps.artifact.outputs.tarball }}" --expected-integrity "${{ needs.preflight.outputs.integrity }}" --output "$GITHUB_OUTPUT"

      - name: Summarize publication
        env:
          RELEASE_KIND: ${{ needs.preflight.outputs.kind }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_DIST_TAG: ${{ needs.preflight.outputs.dist_tag }}
          RELEASE_STATUS: ${{ steps.npm.outputs.status }}
          RELEASE_INTEGRITY: ${{ steps.npm.outputs.integrity }}
        run: |
          {
            echo "### npm publication"
            echo
            echo "- Package: \`@lyds/ui@${RELEASE_VERSION}\`"
            echo "- Kind: \`${RELEASE_KIND}\`"
            echo "- Dist-tag: \`${RELEASE_DIST_TAG}\`"
            echo "- Result: \`${RELEASE_STATUS}\`"
            echo "- Integrity: \`${RELEASE_INTEGRITY}\`"
            if [[ "$RELEASE_STATUS" == "skipped" ]]; then
              echo "- Detail: Exact snapshot version already exists with identical integrity; safely skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
